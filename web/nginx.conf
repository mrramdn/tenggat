# Menyajikan hasil build React dan meneruskan /api serta /health ke container api.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 32k;

    # DNS internal Docker. Nama "api" di-resolve ulang tiap 10 detik, jadi nginx
    # tetap menemukan container api setelah container itu dibuat ulang.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    # Nama file aset hasil build mengandung hash, jadi aman disimpan lama di browser.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Aplikasi satu halaman: alamat yang bukan file diarahkan ke index.html.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
